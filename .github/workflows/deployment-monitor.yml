name: Monitor Deployments

on:
  # Runs every hour to check that seafin.ai is up
  schedule:
    - cron: '0 * * * *'  # Every hour

  # Manual trigger
  workflow_dispatch:

jobs:
  check-deployment:
    name: Check seafin.ai Is Up
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if website is accessible
        id: check
        run: |
          # Check if the production site is up
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://seafin.ai/ || echo "000")

          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Website is accessible (HTTP $HTTP_CODE)"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Website is NOT accessible (HTTP $HTTP_CODE)"
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Check contact form endpoint
        id: check_api
        run: |
          # The form endpoint only accepts POST, so a GET should get 405 from the Worker
          FORM_ENDPOINT=$(curl -s -o /dev/null -w "%{http_code}" https://seafin.ai/api/request || echo "000")

          echo "form_endpoint=$FORM_ENDPOINT" >> $GITHUB_OUTPUT

          if [ "$FORM_ENDPOINT" = "405" ]; then
            echo "✅ Form endpoint answering (HTTP $FORM_ENDPOINT)"
            echo "api_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Form endpoint unexpected response (HTTP $FORM_ENDPOINT)"
            echo "api_status=warning" >> $GITHUB_OUTPUT
          fi

      - name: Create alert if website is down
        if: steps.check.outputs.status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const httpCode = '${{ steps.check.outputs.http_code }}';

            const title = '🚨 CRITICAL: Website Down!';
            const body = `## 🚨 Critical Alert: Website is Down

            **Status:** ❌ Not accessible
            **HTTP Code:** ${httpCode}
            **URL:** https://seafin.ai/
            **Detected:** ${new Date().toISOString()}

            ### 🔍 Immediate Actions

            1. **Check Cloudflare dashboard:** Workers & Pages → seafin-site
            2. **Check Worker logs** with `npx wrangler tail`
            3. **Check recent commits** for breaking changes
            4. **Roll back if necessary** with `npx wrangler rollback`

            ### 🔧 Quick Checks

            \`\`\`bash
            # Check recent deployments
            gh run list --limit 5

            # View latest commit
            git log -1

            # Check Worker deployments
            npx wrangler deployments list
            \`\`\`

            ### 📊 Error Details

            **HTTP Status:** ${httpCode}
            ${httpCode === '000' ? '- Network error or DNS issue' : ''}
            ${httpCode === '404' ? '- Page not found' : ''}
            ${httpCode === '500' ? '- Server error' : ''}
            ${httpCode === '502' || httpCode === '503' ? '- Service unavailable' : ''}

            ---

            **⚠️ CRITICAL: Your production website is down. Immediate action required!**
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['critical', 'production-down', 'automated-alert']
            });

      - name: Post deployment summary
        run: |
          echo "## 🌐 Deployment Status Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website:** ${{ steps.check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**API:** ${{ steps.check_api.outputs.api_status }}" >> $GITHUB_STEP_SUMMARY
          echo "**HTTP Code:** ${{ steps.check.outputs.http_code }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.status }}" = "success" ]; then
            echo "✅ All systems operational" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Issues detected - check alerts" >> $GITHUB_STEP_SUMMARY
          fi
